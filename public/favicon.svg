<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The <style> block is load-bearing: prefers-color-scheme can't be expressed
    as a presentation attribute, so the media query is the only way to flip the
    bars for a dark tab strip. Two things it costs us:

      - Don't inline this file into the app. As inline SVG these rules stop
        being file-scoped and become document-global CSS.
      - Don't run it through an SVG optimiser with style inlining enabled
        (svgo's inlineStyles). Flattening the query kills the flip silently.

    Safari ignores the query when rendering favicons and falls through to the
    unqueried values, which are the light-chrome mark — so there is no third
    variant to reason about.
  -->
  <style>
    .swd-bar { fill: #262626 }
    .swd-kicker { fill: #ffe81f }

    /* --muted-foreground, oklch(0.708 0 0). Deliberately dimmer than the
       kicker: #ffe81f has a relative luminance of .79, so near-white bars
       would sit level with it and it would stop reading as an accent. */
    @media (prefers-color-scheme: dark) {
      .swd-bar { fill: #a1a1a1 }
    }
  </style>
  <rect class="swd-kicker" x="1.5" y="3.51" width="11.28" height="4.03" rx="2.01"/>
  <rect class="swd-bar" x="1.5" y="12.38" width="29" height="5.64" rx="2.82"/>
  <rect class="swd-bar" x="1.5" y="22.85" width="20.14" height="5.64" rx="2.82"/>
</svg>
